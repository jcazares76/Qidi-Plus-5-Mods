# Builds the download-and-run zip for non-technical users.
#  - Push a tag like v1.0.0  -> builds and attaches QIDI-Plus-5-Dashboard-v1.0.0.zip to a GitHub Release.
#  - Run manually (Actions tab) -> builds the zip and keeps it as a workflow artifact (no release).
name: Release dashboard

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content angular/package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match package.json version $v" }

      - name: Install dependencies
        working-directory: angular
        run: npm ci

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Keep the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-zip
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Download `QIDI-Plus-5-Dashboard-${{ github.ref_name }}.zip` below**, unzip it, and double-click
            `Open Dashboard.bat`. See `README-FIRST.txt` inside for step-by-step instructions.
            Windows 10/11, printer on the same network. Nothing to install.
