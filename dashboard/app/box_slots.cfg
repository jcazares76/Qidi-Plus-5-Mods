# QIDI Box slot editor — restores computer-side slot type/color editing.
# Include from printer.cfg with:  [include box_slots.cfg]
# Kept in its own file so QIDI firmware updates (which replace printer.cfg)
# only need that one include line re-added.
#
# Slots are numbered 1-16 as printed on the box (box 1 = slots 1-4).
# SLOT=EXT (or 17) is the external spool holder.
# Data is stored the same way the touchscreen stores it:
#   filament_slot<N-1> = QIDI filament ID (e.g. "QFA00")
#   color_slot<N-1>    = ['RRGGBB']
#   (external spool = filament_slot16 / color_slot16)
#
# The stored type/color stays after a spool is removed. The box's spool sensor
# (box_extras boxes[b].box_inserted_<i>) says whether a spool is really there,
# and the touchscreen shows the slot as empty when it reads 0.

[gcode_macro _BOX_SLOT_DATA]
variable_filaments: {
      "PLA_BASIC": "QFA00",
      "PLA_MATTE_BASIC": "QFA01",
      "PLA_RAPIDO": "QFA02",
      "PLA_RAPIDO_MATTE": "QFA03",
      "PLA_RAPIDO_METAL": "QFA04",
      "PLA_RAPIDO_SILK": "QFA05",
      "WOOD_RAPIDO": "QFA16",
      "PLA-CF": "QFA50",
      "GENERIC_PLA": "QFA90",
      "GENERIC_PLA+": "QFA91",
      "GENERIC_PLA_SILK": "QFA92",
      "ASA": "QFB01",
      "ASA-AERO": "QFB02",
      "ABS-GF": "QFB50",
      "ASA-CF20_CORE": "QFB51",
      "ABS_ODORLESS": "QFB53",
      "ABS_RAPIDO": "QFB54",
      "ABS_RAPIDO_METAL": "QFB55",
      "GENERIC_ABS": "QFB91",
      "PC-ABS-FR": "QFC02",
      "GENERIC_PC": "QFC90",
      "PETG_BASIC": "QFG00",
      "PETG_RAPIDO": "QFG02",
      "PETG_TOUGH": "QFG03",
      "PETG_TRANSLUCENT": "QFG04",
      "PETG-CF": "QFG50",
      "PETG-GF": "QFG51",
      "GENERIC_PETG": "QFG90",
      "HATCHBOX_PLA": "QFL10",
      "HATCHBOX_PETG": "QFL11",
      "HATCHBOX_ABS": "QFL12",
      "POLYLITE_PLA": "QFL20",
      "POLYLITE_ABS": "QFL22",
      "POLYMAKER_PLA-HT": "QFL24",
      "BAMBU_PLA": "QFL30",
      "BAMBU_PETG": "QFL31",
      "BAMBU_ABS": "QFL32",
      "OVERTURE_PLA": "QFL60",
      "OVERTURE_ABS": "QFL62",
      "PAHT-CF": "QFN04",
      "PA6-CF": "QFN05",
      "PA12-CF": "QFN12",
      "PAHT-GF": "QFN14",
      "ULTRAPA": "QFN20",
      "ULTRAPA-CF25": "QFN21",
      "PPS-CF": "QFP01",
      "PPS-GF": "QFP02",
      "SUPPORT_FOR_PET-PA": "QFS01",
      "SUPPORT_FOR_PAHT": "QFS03",
      "PET-CF": "QFT01",
      "PET-GF": "QFT02",
      "TPU-AERO": "QFU00",
      "TPU_95A-HF": "QFU01",
      "TPU-GF": "QFU02",
      "PEBA_95A": "QFU03",
      "GENERIC_TPU_95A": "QFU91"
  }
variable_colors: {
      "WHITE": "FAFAFA", "BLACK": "060606", "GREY": "8E9089", "GRAY": "8E9089",
      "SILVER": "D9E3ED", "RED": "E02928", "ORANGE": "F98C36", "YELLOW": "F4EE2A",
      "GREEN": "228332", "LIME": "5CF30F", "BLUE": "2850FF", "NAVY": "0A2989",
      "PURPLE": "A03CF7", "PINK": "FE98FE", "BROWN": "8E5A2B", "BEIGE": "EBDDB4",
      "GOLD": "DFD628", "TEAL": "009FA1", "CYAN": "43E3E6"
  }
gcode:

[gcode_macro SET_SLOT_FILAMENT]
description: Set a slot's filament. SLOT=1-16 or EXT, FILAMENT=PLA_BASIC (or ID like QFA00), COLOR=FFFFFF (or WHITE)
gcode:
  {% set data = printer["gcode_macro _BOX_SLOT_DATA"] %}
  {% set slot_in = params.SLOT|default('')|string|upper %}
  {% if slot_in in ['EXT', 'EXTERNAL', '17'] %}
    {% set idx = 16 %}
  {% else %}
    {% set slot = slot_in|int(0) %}
    {% if slot < 1 or slot > 16 %}
      {action_raise_error("SET_SLOT_FILAMENT: SLOT must be 1-16 or EXT")}
    {% endif %}
    {% set count = printer.save_variables.variables.box_count|default(1)|int %}
    {% if slot > count * 4 %}
      {action_raise_error("SET_SLOT_FILAMENT: slot %d is on box %d, but only %d box(es) connected" % (slot, (slot - 1) // 4 + 1, count))}
    {% endif %}
    {% set idx = slot - 1 %}
  {% endif %}

  {% set fil_in = params.FILAMENT|default('')|string|upper|replace(' ', '_') %}
  {% if fil_in == '' %}
    {% set fil_id = '' %}
  {% elif fil_in in data.filaments %}
    {% set fil_id = data.filaments[fil_in] %}
  {% elif fil_in in data.filaments.values()|list %}
    {% set fil_id = fil_in %}
  {% else %}
    {action_raise_error("SET_SLOT_FILAMENT: unknown FILAMENT '%s'. Run LIST_FILAMENT_TYPES to see options." % fil_in)}
  {% endif %}

  {% set col_in = params.COLOR|default('')|string|upper %}
  {% if col_in|length == 7 %}
    {% set col_in = col_in[1:] %}
  {% endif %}
  {% if col_in in data.colors %}
    {% set col_in = data.colors[col_in] %}
  {% endif %}
  {% if col_in != '' %}
    {% set bad = [] %}
    {% for ch in col_in %}
      {% if ch not in '0123456789ABCDEF' %}{% set _ = bad.append(ch) %}{% endif %}
    {% endfor %}
    {% if col_in|length != 6 or bad|length > 0 %}
      {action_raise_error("SET_SLOT_FILAMENT: COLOR must be 6 hex digits (e.g. FF8800) or a name like WHITE")}
    {% endif %}
  {% endif %}

  {% if fil_id == '' and col_in == '' %}
    {action_raise_error("SET_SLOT_FILAMENT: give FILAMENT and/or COLOR")}
  {% endif %}
  {% if fil_id != '' %}
    SAVE_VARIABLE VARIABLE=filament_slot{idx} VALUE='"{fil_id}"'
  {% endif %}
  {% if col_in != '' %}
    SAVE_VARIABLE VARIABLE=color_slot{idx} VALUE="['{col_in}']"
  {% endif %}
  _REPORT_SLOT_FILAMENT IDX={idx}

# Prints the external spool holder contents (slot index 16).
[gcode_macro _EXT_SPOOL_TEXT]
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set names = {} %}
  {% for n, i in printer["gcode_macro _BOX_SLOT_DATA"].filaments.items() %}
    {% set _ = names.update({i: n}) %}
  {% endfor %}
  {% set fid = sv.filament_slot16|default(1) %}
  {% set col = sv.color_slot16|default(1) %}
  {% set fid_s = fid if fid is string else 'not set' %}
  {% set col_s = col[0] if col is sequence and col is not string else 'not set' %}
  {action_respond_info("External spool: %s (%s)  %s" % (names[fid_s]|default(fid_s), fid_s, col_s))}

[gcode_macro _REPORT_SLOT_FILAMENT]
gcode:
  {% set idx = params.IDX|int %}
  {% if idx == 16 %}
    _EXT_SPOOL_TEXT
  {% else %}
    {% set box = printer.box_extras.boxes[idx // 4] %}
    {% set f = box.filament_info[idx % 4] %}
    {% set present = box["box_inserted_%d" % (idx % 4)]|default(1)|int %}
    {action_respond_info("Slot %d set: %s %s (%s)  %s%s" % (idx + 1, f.vendor_str, f.filament_str, f.filament_id, f.color_rgb_str[0] if f.color_rgb_str else '?', '' if present else '  (no spool detected in this slot)'))}
  {% endif %}

[gcode_macro LIST_SLOT_FILAMENTS]
description: Show filament type and color for each box slot and the external spool
gcode:
  {% set boxes = printer.box_extras.boxes %}
  {% set count = printer.save_variables.variables.box_count|default(1)|int %}
  {% set lines = [] %}
  {% for b in range(count) %}
    {% for f in boxes[b].filament_info %}
      {% set desc = "%s %s (%s)  %s" % (f.vendor_str, f.filament_str, f.filament_id, f.color_rgb_str[0] if f.color_rgb_str else '?') %}
      {% if boxes[b]["box_inserted_%d" % f.index]|default(1)|int %}
        {% set _ = lines.append("Slot %d: %s" % (b*4 + f.index + 1, desc)) %}
      {% else %}
        {% set _ = lines.append("Slot %d: empty  (last set: %s)" % (b*4 + f.index + 1, desc)) %}
      {% endif %}
    {% endfor %}
  {% endfor %}
  {action_respond_info(lines|join("\n"))}
  _EXT_SPOOL_TEXT

[gcode_macro LIST_FILAMENT_TYPES]
description: List FILAMENT names accepted by SET_SLOT_FILAMENT
gcode:
  {% set data = printer["gcode_macro _BOX_SLOT_DATA"] %}
  {% set lines = [] %}
  {% for name, id in data.filaments|dictsort %}
    {% set _ = lines.append("%s = %s" % (name, id)) %}
  {% endfor %}
  {action_respond_info("FILAMENT options:\n" ~ lines|join("\n") ~ "\nCOLOR names: " ~ data.colors.keys()|list|sort|join(", "))}
